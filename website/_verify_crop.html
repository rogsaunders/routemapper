<!doctype html><html><head><meta charset="utf-8"/><style>
 body{margin:0;background:#0f172a;padding:16px;font-family:Inter,system-ui,sans-serif}
 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:1000px;margin:0 auto}
 .cap{color:#9fb0c4;font-size:12px;text-align:center;margin:6px 0 0}
 .lp-shot{border-radius:16px;overflow:hidden;border:1px solid #1c2434;background:#060a12;box-shadow:0 20px 50px -25px rgba(0,0,0,.8);aspect-ratio:1640/2285}
 .lp-shot img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
</style></head><body><div class="row">
 <div><div class="lp-shot"><img src="assets/live-record.png"></div><p class="cap">Record</p></div>
 <div><div class="lp-shot"><img src="assets/live-review.png"></div><p class="cap">Review</p></div>
 <div><div class="lp-shot"><img src="assets/live-drive.png"></div><p class="cap">Drive</p></div>
</div></body></html>
