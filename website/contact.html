<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Contact — Route Mapper</title>

    <meta
      name="description"
      content="Contact Route Mapper — questions, licensing, partnerships."
    />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="mobile-menu.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="assets/route-logo-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <!-- NAV -->
    <script src="/site-chrome.js" data-part="header" data-theme="dark"></script>

    <!-- MAIN -->
    <main class="container section" style="padding-top: 130px">
      <h1>Get in Touch</h1>
      <p class="lead">
        Questions about Route Mapper? Want to discuss bulk licensing for your
        organisation?
      </p>

      <form
        name="Contact"
        method="POST"
        data-netlify="true"
        netlify
        netlify-honeypot="bot-field"
        action="thanks-contact.html"
        class="contact-form"
      >
        <input type="hidden" name="form-name" value="contact" />

        <p class="hidden">
          <label>Don’t fill this out: <input name="bot-field" /></label>
        </p>

        <input type="text" name="name" placeholder="Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="phone" name="phone" placeholder="Phone" />
        <textarea
          name="message"
          placeholder="Message"
          rows="6"
          required
        ></textarea>

        <!-- Optional spam protection -->
        <!-- <div data-netlify-recaptcha="true"></div> -->

        <button class="btn btn-green" type="submit">Send</button>
      </form>
    </main>

    <!-- FOOTER -->
    <script src="/site-chrome.js" data-part="footer"></script>
    <script src="/mobile-menu.js"></script>
  </body>
</html>
